# Rime schema
# encoding: utf-8

schema:
  schema_id: liubi
  name: "六筆輸入法"
  version: "1.0"
  author: "AI"
  description: "純數字 78945 盲打六筆全碼輸入法"

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator    
    - history_translator   
  filters:
    - uniquifier          # 如果有去重，建議放前面  
    - single_char_filter  # ← 加呢行
    - lua_filter@*force_weight_sort

speller:
  # 💡 核心設定：宣告 78945 就是輸入法的合法字元
  alphabet: "iopkl"
  max_code_length: 20        # 允許的最長字碼位數（例如改為 12 位，可依需求再加大）
  auto_select: false         # 關閉自動上屏，避免打太長時系統幫你亂選字

key_binder:
  import_preset: default
  bindings:
    # ====================================================
    # 流程 A：小鍵盤負責打字（不論何時，按小鍵盤就是送出六筆字碼）
    # ====================================================
    - { when: always, accept: "KP_7", send: "i" }
    - { when: always, accept: "KP_8", send: "o" }
    - { when: always, accept: "KP_9", send: "p" }
    - { when: always, accept: "KP_4", send: "k" }
    - { when: always, accept: "KP_5", send: "l" }

    # ====================================================
    # 流程 B：大鍵盤負責選字（💡 只有「有選單時」，按大鍵盤才會觸發選字）
    # ====================================================
    - { when: paging, accept: "1", send: "1" }
    - { when: paging, accept: "2", send: "2" }
    - { when: paging, accept: "3", send: "3" }

    # Ctrl + 小鍵盤 1-3 選第 4-6 個
    - { when: paging, accept: "shift+4", send: "4" }
    - { when: paging, accept: "shift+5", send: "5" }
    - { when: paging, accept: "shift+6", send: "6" }

    # Alt + 小鍵盤 1-3 選第 7-9 個
    - { when: paging, accept: "shift+7", send: "7" }
    - { when: paging, accept: "shift+8", send: "8" }
    - { when: paging, accept: "shift+9", send: "9" }
    # ====================================================
    # 流程 C：其他輔助功能鍵
    # ====================================================
    - { when: has_menu, accept: "KP_0", send: "void" } # 按小鍵盤 0 取消打字
    - { when: has_menu, accept: "KP_Add", send: Page_Down } # 小鍵盤 + 鍵翻下一頁
    - { when: has_menu, accept: "KP_Subtract", send: Page_Up } # 小鍵盤 - 鍵翻上一頁

menu:
  page_size: 9

translator:
  dictionary: liubi
  # 💡 修正 3：更換數據庫名稱，直接繞過那個刪不掉的舊 liubi_user_history！
  user_dict: liubi_new_clean_history_3
  enable_user_dict: true
  enable_sentence: false
  enable_encoder: false
  sort_by_weight: true
  initial_quality: 1000
  completion: true    # 💡 核心設定：開啟編碼提示 / 逐碼提示
  preedit_format:
    - xlit/iopkl/⼀⼁丿丶フ/
  comment_format:
    - xform/~//
    - xlit/iopkl/⼀⼁⼃⼂フ/

history_translator:
  input: " "          # 空格鍵作為引導鍵（您可以改成分號 ";" 或引號 "'"）
  size: 1             # 聯想前 1 個上屏的字
  initial_quality: 2000  # 聯想詞的權重權限

punctuator:
  import_preset: default
  full_shape:
    ",": "，"
    ".": "。"
    "?": "？"
    "!": "！"
    ":": "："
    ";": "；"
    "(": "（"
    ")": "）"
    "[": "「"
    "]": "」"
    "{": "『"
    "}": "』"
    "<": "《"
    ">": "》"
    "/": "、"
    "\\": "、"
    "'": "‘"
    "\"": "“"
    "-": "—"
    "_": "——"
    "~": "～"
    "`": "·"
